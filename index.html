<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Via Verde</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🌿 Via Verde</h1><p>Calculadora de atividade física</p></header>

<main>
<section class="card">
<img src="via verde.jpg" alt="Via Verde">
<div class="form">
<h2>Calcule seu desempenho</h2>
<p>Informe a distância e o tempo da atividade.</p>

<label>Distância</label>

<div class="input"><input id="distancia" type="number" placeholder="Ex: 5"><span>km</span></div>

<label>Tempo</label>

<div class="input"><input id="tempo" type="number" placeholder="Ex: 30"><span>min</span></div>

<button onclick="calcular()">Calcular</button>

</div>
</section>

<section class="resultados">
<h2>Seus resultados</h2>
<div class="grid">
<div><b>⚡</b><span>Velocidade</span><strong id="velocidade">--</strong><small>km/h</small></div>
<div><b>⏱️</b><span>Tempo</span><strong id="resultadoTempo">--</strong><small>min</small></div>
<div><b>📏</b><span>Distância</span><strong id="resultadoDistancia">--</strong><small>m</small></div>
<div><b>🏃</b><span>Ritmo</span><strong id="ritmo">--</strong><small>min/km</small></div>
</div>
</section>
</main>

<footer>Via Verde • Jaraguá do Sul 🌿</footer>
<script src="app.js"></script>
</body>
</html>
